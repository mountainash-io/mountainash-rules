# Mountainash Rules — chapter-focused practitioner and maintainer manual.

site_name: 'Mountainash Rules'
site_description: 'A practical manual for authoring, evaluating, explaining and extending tabular business rules'
site_author: 'Nathaniel Ramm'
site_url: !ENV [TEXTBOOK_SITE_URL, 'https://docs.mountainash.io/mountainash-rules/']

# Hooks — runs local Python before/after page processing
# social_override.py lets per-page `image:` frontmatter override the auto-
# generated social card URL for og:image and twitter:image meta tags.
hooks:
  - plugins/social_override.py

# Repository
repo_name: 'GitHub Repo'
repo_url: 'https://github.com/mountainash-io/mountainash-rules'
edit_uri: !ENV [TEXTBOOK_EDIT_URI, 'edit/main/docs-site/site/docs/']

# Copyright
copyright: 'Copyright &copy; 2026 Nathaniel Ramm. Licensed under <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/">CC BY-NC-SA 4.0</a> for non-commercial use.'

# Navigation
# IMPORTANT: do NOT add `navigation.tabs` — these books use side navigation
# optimized for wide landscape screens.
nav:
  - Home: index.md

  - Book contents: chapters/index.md

  - Shared foundations:
      - 1. Two Engines, One Rule Model: chapters/01-two-rule-engines/index.md
      - "2. The Shared Rule Model: Tables, Contexts and Dimensions": chapters/02-shared-rule-model/index.md
      - "3. Matching Concepts: Strategies, Unknowns and Wildcards": chapters/03-matching-concepts/index.md

  - The Expression Rules Engine:
      - 4. Using the Expression Rules Engine: chapters/04-expression-rules-engine/index.md
      - 5. Expression Engine Hit Policies, Results and Explanations: chapters/05-expression-results-and-policies/index.md
      - 6. Expression Engine Batch Evaluation: chapters/06-batch-evaluation/index.md

  - The DecisionTable:
      - 7. Prevalidating Rules and Building a DecisionTable: chapters/07-decision-table-construction/index.md
      - 8. Validating Contexts, Matching and Persisting a DecisionTable: chapters/08-applying-decision-tables/index.md

  - Implementation and extension:
      - 9. Inside the Expression Rules Engine: chapters/09-expression-engine-internals/index.md
      - 10. Inside the DecisionTable: chapters/10-decision-table-internals/index.md
      - 11. Extending and Maintaining the Package: chapters/11-extending-and-maintaining/index.md

  - Appendices:
      - FAQ: faq.md
      - Glossary: glossary.md

  - License: license.md
  - Contact: contact.md

# Theme configuration
theme:
  name: material
  # Once a logo is generated, point this at docs/img/logo.png or a mascot pose:
  # logo: img/logo.png
  # favicon: img/favicon.ico
  palette:
    primary: 'green'
    accent: 'orange'
  include_sidebar: true
  features:
    - content.code.copy
    - content.action.edit
    - navigation.expand
    - navigation.path
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share

# Plugins
plugins:
  - search
  # Uncomment after running `pip install "mkdocs-material[imaging]"`:
  # - social
  # Uncomment after running `pip install mkdocs-glightbox`:
  # - glightbox:
  #     touchNavigation: true
  #     loop: false
  #     effect: zoom
  #     slide_effect: slide
  #     width: 100%
  #     height: auto
  #     zoomable: true
  #     draggable: true
  #     auto_caption: false
  #     caption_position: bottom
  #     skip_classes:
  #       - mascot-admonition-img   # keep mascot poses out of the lightbox gallery

# Markdown extensions
markdown_extensions:
  - md_in_html
  - admonition
  - attr_list
  - footnotes
  - tables
  - sane_lists
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.arithmatex:
      generic: true

# Custom CSS — file is created by init-textbook
extra_css:
  - css/extra.css

# Custom JavaScript — uncomment once a corresponding file exists
# extra_javascript:
#   - js/extra.js

# Exclude prompt scratch files and TODOs from build/search/sitemap
exclude_docs: |
  **/image-prompt*.md
  **/image-prompts*.md
  **/cover-prompt.md
  **/TODO.md

# Rebuild on changes during `mkdocs serve`
watch:
  - docs
  - mkdocs.yml

# Extra
extra:
  # Suppress the "Made with Material for MkDocs" footer line
  generator: false

  # MicroSim build-status indicators shown next to nav entries.
  # The status value is set per-page in the index.md frontmatter:
  #   status: scaffold | built | approved
  # Colors are defined as CSS custom properties in docs/css/extra.css.
  # Note: `theme.icon.status` is a Material Insiders feature and is silently
  # ignored on community Material. Do not add it — the CSS-variable approach
  # in extra.css is the load-bearing piece on the community edition.
  status:
    scaffold: Scaffold — placeholder, not yet implemented
    built: Built — implementation complete, awaiting review
    approved: Approved — tested and approved

  # Intelligent-textbook URI scheme (see
  # https://dmccreary.github.io/intelligent-textbooks/uri-scheme/)
  schema: https://dmccreary.github.io/intelligent-textbooks/ns/textbook/v1
  textbook_name: 'Mountainash Rules'
  textbook_version: '0.1'

  # Google Analytics — uncomment once a property ID exists:
  # analytics:
  #   provider: google
  #   property: G-XXXXXXXXXX
