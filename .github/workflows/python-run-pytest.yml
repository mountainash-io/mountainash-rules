name: Pytest Runner

on:
  pull_request:
    paths:
      - "src/mountainash_rules/**"
      - "tests/**"
      - "native/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - "THIRD_PARTY_LICENSES"
      - "scripts/native_wheel_smoke.py"
      - ".github/workflows/python-run-pytest.yml"
      - "hatch_build.py"
      - "pyproject.toml"
      - "hatch.toml"
  workflow_dispatch:
    inputs:
      fallback_branch:
        description: "Fallback branch to use"
        required: true
        default: "develop"
        type: choice
        options:
          - develop
          - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python-version: ["3.12"]

    steps:
      - name: Set fallback branch
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "FALLBACK_BRANCH=${{ github.event.inputs.fallback_branch }}" >> $GITHUB_ENV
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "FALLBACK_BRANCH=${{ github.base_ref }}" >> $GITHUB_ENV
          else
            echo "FALLBACK_BRANCH=develop" >> $GITHUB_ENV
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          check-latest: true

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: mountainash-io

      - name: Load Dependencies
        id: deps
        uses: ./.github/actions/load-dependencies
        with:
          config-path: .github/config/mountainash_dependencies.yml

      - name: Checkout Dependencies
        uses: ./.github/actions/checkout-dependencies
        with:
          dependencies: ${{ steps.deps.outputs.dependencies }}
          target-branch: ${{ github.head_ref }}
          default-branch: ${{ env.FALLBACK_BRANCH }}
          token: ${{ steps.app-token.outputs.token }}
          org-name: mountainash-io

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run native language regressions
        run: cargo test --locked --lib

      - name: Install Hatch
        run: pip install hatch

      - name: Create virtual environment
        run: hatch env create test_github

      - name: Run Coverage Tests
        run: hatch run test_github:test-cov

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          verbose: true

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
