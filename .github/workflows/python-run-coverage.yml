name: Coverage

on: 
  push:
    paths:
      - 'src/mountainash_utils_rules/**'    
  workflow_dispatch:

jobs:

  coverage-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"


      # - name: Checkout private repositories - mountainash-constants
      #   uses: actions/checkout@v4
      #   with:
      #     repository: mountainash-io/mountainash-constants
      #     ref: main
      #     token: ${{ secrets.CLONE_PRIVATE_REPOS_TOKEN }}
      #     path: temp/mountainash-constants        
      #     fetch-depth: 1
  
      # - name: Checkout private repositories - mountainash-settings
      #   uses: actions/checkout@v4
      #   with:
      #     repository: mountainash-io/mountainash-settings
      #     ref: main
      #     token: ${{ secrets.CLONE_PRIVATE_REPOS_TOKEN }}
      #     path: temp/mountainash-settings        
      #     fetch-depth: 1
  
            


      - name: Install Hatch
        run: pip install hatch

      - name: Create virtual environment
        run: hatch env create test_github

      - name: Run Coverage Tests
        run: hatch run test_github:cov

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4.0.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: mountainash-io/mountainash-utils-rules
      