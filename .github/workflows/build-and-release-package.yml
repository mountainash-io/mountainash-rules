name: Build and Release Wheel with SBOMs

on:
  pull_request:
    types: [closed]
    branches:
      - "main"
      - "develop"
      - "release*"
      - "feature*"
      - "bugfix*"
      - "hotfix*"

  # Add manual workflow dispatch with fallback branch selection
  workflow_dispatch:
    inputs:
      release_type:
        description: "Type of release to create"
        required: true
        default: "production"
        type: "choice"
        options:
          - production
          - rc
          - beta

      source_branch:
        description: "Branch containing code to release"
        required: true
        default: "main"
        type: "string"

      fallback_branch:
        description: "Fallback branch to use for dependencies"
        required: true
        default: "main"
        type: choice
        options:
          - develop
          - main

permissions:
  contents: write
  pull-requests: read

env:
  PACKAGE_SRCDIR: mountainash_rules
  PACKAGE_NAME: mountainash-rules
  ORGNAME: mountainash-io

jobs:
  # ============================================================
  # Compute the release version/type once; every other job reads
  # its outputs instead of recomputing them.
  configure-release:
    if: github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    outputs:
      resolved_sha: ${{ steps.resolved_sha.outputs.SHA }}
      source_branch: ${{ steps.branch_vars.outputs.SOURCE_BRANCH }}
      target_branch: ${{ steps.branch_vars.outputs.TARGET_BRANCH }}
      fallback_branch: ${{ steps.branch_vars.outputs.FALLBACK_BRANCH }}
      base_version: ${{ steps.base_version.outputs.BASE_VERSION }}
      version: ${{ steps.release_config.outputs.FULL_VERSION }}
      version_suffix: ${{ steps.release_config.outputs.VERSION_SUFFIX }}
      release_type: ${{ steps.release_config.outputs.RELEASE_TYPE }}
      release_title: ${{ steps.release_config.outputs.RELEASE_TITLE }}
      release_description: ${{ steps.release_config.outputs.RELEASE_DESCRIPTION }}
      is_prerelease: ${{ steps.release_config.outputs.IS_PRERELEASE }}

    env:
      BUILD_ENV: "build_github"

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: mountainash-io

      # ======================================================
      # INITIALIZE

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Checkout Repository (PR)
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Checkout Repository (Manual)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.source_branch }}
          fetch-depth: 0

      - name: Set Branch Vars
        id: branch_vars
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SOURCE_BRANCH: ${{ inputs.source_branch }}
          INPUT_FALLBACK_BRANCH: ${{ inputs.fallback_branch }}
          INPUT_RELEASE_TYPE: ${{ inputs.release_type }}
          PR_SOURCE_BRANCH: ${{ github.head_ref }}
          PR_TARGET_BRANCH: ${{ github.base_ref }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            SOURCE_BRANCH="$INPUT_SOURCE_BRANCH"
            TARGET_BRANCH="$INPUT_SOURCE_BRANCH"
            FALLBACK_BRANCH="$INPUT_FALLBACK_BRANCH"
            MANUAL_RELEASE_TYPE="$INPUT_RELEASE_TYPE"
          else
            SOURCE_BRANCH="$PR_SOURCE_BRANCH"
            TARGET_BRANCH="$PR_TARGET_BRANCH"
            FALLBACK_BRANCH=main
            MANUAL_RELEASE_TYPE=
          fi
          for output in "$GITHUB_ENV" "$GITHUB_OUTPUT"; do
            {
              echo "SOURCE_BRANCH=$SOURCE_BRANCH"
              echo "TARGET_BRANCH=$TARGET_BRANCH"
              echo "FALLBACK_BRANCH=$FALLBACK_BRANCH"
              echo "MANUAL_RELEASE_TYPE=$MANUAL_RELEASE_TYPE"
            } >> "$output"
          done

      # ======================================================
      # DEPENDENCIES

      - name: Python Dependencies
        run: |
          pip install hatchling==1.29.0
          pip install hatch==1.16.5

      # Checkout Mountain Ash Dependencies
      - name: Load Dependencies
        id: deps
        uses: ./.github/actions/load-dependencies
        with:
          config-path: .github/config/mountainash_dependencies.yml

      - name: Checkout Dependencies
        uses: ./.github/actions/checkout-dependencies
        with:
          dependencies: ${{ steps.deps.outputs.dependencies }}
          target-branch: ${{ env.TARGET_BRANCH }}
          default-branch: ${{ env.FALLBACK_BRANCH }}
          token: ${{ steps.app-token.outputs.token }}
          org-name: ${{ env.ORGNAME }}

      # ======================================================
      # CONFIGURE RELEASE

      - name: Get Base Version
        id: base_version
        run: |
          BASE_VERSION=$(hatch version)
          echo "BASE_VERSION=${BASE_VERSION}" >> $GITHUB_ENV
          echo "BASE_VERSION=${BASE_VERSION}" >> $GITHUB_OUTPUT

          # Validate semantic version format
          if [[ ! "$BASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Base version must be in semantic version format (X.Y.Z)"
            exit 1
          fi

      - name: Determine Release Configuration
        id: release_config
        run: |
          # Initialize variables
          RELEASE_TYPE=""
          VERSION_SUFFIX=""
          IS_PRERELEASE="true"
          RELEASE_TITLE=""
          RELEASE_DESCRIPTION=""

          # Function to get latest version number
          get_latest_version() {
            local prefix="$1"
            local suffix="$2"
            curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/releases" | \
              jq -r --arg prefix "$prefix" --arg suffix "$suffix" \
              "map(select(.tag_name | startswith(\$prefix) and contains(\$suffix))) | .[0].tag_name" || echo ""
          }

          # Check for manual workflow run
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Using manual release type: ${{ env.MANUAL_RELEASE_TYPE }}"

            case "${{ env.MANUAL_RELEASE_TYPE }}" in
              "production")
                RELEASE_TYPE="production"
                VERSION_SUFFIX=""
                IS_PRERELEASE="false"
                RELEASE_TITLE="Production Release"
                RELEASE_DESCRIPTION="Production release from ${SOURCE_BRANCH} branch"
                ;;
              "rc")
                RELEASE_TYPE="rc"
                # Get latest RC number for this version
                LATEST_RC=$(get_latest_version "v${BASE_VERSION}" "rc")
                RC_NUM=$(echo "$LATEST_RC" | grep -oP 'rc\K\d+' || echo "0")
                VERSION_SUFFIX="rc$((RC_NUM + 1))"
                RELEASE_TITLE="Release Candidate"
                RELEASE_DESCRIPTION="Release candidate from ${SOURCE_BRANCH} branch"
                ;;
              "beta")
                RELEASE_TYPE="beta"
                # Extract feature name from branch if possible
                FEATURE_NAME=$(echo ${SOURCE_BRANCH} | grep -oP '(feature|bugfix|hotfix)/\K[^/]+' || echo "manual")
                # Get latest beta number for this feature
                LATEST_BETA=$(get_latest_version "v${BASE_VERSION}" "beta.${FEATURE_NAME}")
                BETA_NUM=$(echo "$LATEST_BETA" | grep -oP 'beta\.[^.]+\.\K\d+' || echo "0")
                VERSION_SUFFIX="beta.${FEATURE_NAME}.$((BETA_NUM + 1))"
                RELEASE_TITLE="Beta Release"
                RELEASE_DESCRIPTION="Beta release from ${SOURCE_BRANCH} branch"
                ;;
            esac
          else

            # Determine release type and version suffix
            case "${{ env.TARGET_BRANCH }}" in
              "main")
                if [[ "${{ env.SOURCE_BRANCH }}" =~ ^(release|hotfix)/ ]]; then
                  RELEASE_TYPE="production"
                  VERSION_SUFFIX=""
                  IS_PRERELEASE="false"
                  RELEASE_TITLE="Production Release"
                  RELEASE_DESCRIPTION="Full production release from release branch"
                else
                  echo "Error: Only release branches can target main"
                  exit 1
                fi
                ;;

              "develop")
                RELEASE_TYPE="rc"
                # Get latest RC number for this version
                LATEST_RC=$(get_latest_version "v${BASE_VERSION}" "rc")
                RC_NUM=$(echo "$LATEST_RC" | grep -oP 'rc\K\d+' || echo "0")
                VERSION_SUFFIX="rc$((RC_NUM + 1))"
                RELEASE_TITLE="Release Candidate"
                RELEASE_DESCRIPTION="Release candidate for testing and validation"
                ;;

              *)
                if [[ "$SOURCE_BRANCH" == feature/* || "$SOURCE_BRANCH" == bugfix/* || "$SOURCE_BRANCH" == hotfix/* ]]; then
                  RELEASE_TYPE="beta"
                  # Extract feature/bugfix name from branch
                  FEATURE_NAME="${SOURCE_BRANCH#*/}"
                  # Get latest beta number for this feature
                  LATEST_BETA=$(get_latest_version "v${BASE_VERSION}" "beta.${FEATURE_NAME}")
                  BETA_NUM=$(echo "$LATEST_BETA" | grep -oP 'beta\.[^.]+\.\K\d+' || echo "0")
                  VERSION_SUFFIX="beta.${FEATURE_NAME}.$((BETA_NUM + 1))"
                  RELEASE_TITLE="Beta Release"
                  RELEASE_DESCRIPTION="Beta release for feature testing: ${FEATURE_NAME}"
                fi
                ;;
            esac
          fi

          # Set full version
          FULL_VERSION="${BASE_VERSION}${VERSION_SUFFIX:+$VERSION_SUFFIX}"

          # Output all variables
          {
            echo "RELEASE_TYPE=${RELEASE_TYPE}"
            echo "VERSION_SUFFIX=${VERSION_SUFFIX}"
            echo "IS_PRERELEASE=${IS_PRERELEASE}"
            echo "FULL_VERSION=${FULL_VERSION}"
            echo "RELEASE_TITLE=${RELEASE_TITLE}"
            echo "RELEASE_DESCRIPTION=${RELEASE_DESCRIPTION}"
          } >> $GITHUB_OUTPUT

          echo "VERSION=${FULL_VERSION}" >> $GITHUB_ENV

      - name: Validate Release
        run: |
          # Check if tag already exists
          if git rev-parse "v${{ env.VERSION }}" >/dev/null 2>&1; then
            echo "Error: Tag v${{ env.VERSION }} already exists"
            exit 1
          fi

          # Check if release already exists
          RELEASE_ID=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/v${{ env.VERSION }}" \
            | jq -r '.id')
          if [ "$RELEASE_ID" != "null" ]; then
            echo "Error: Release v${{ env.VERSION }} already exists"
            exit 1
          fi

      - name: Create Release Branch
        if: startsWith(github.head_ref, 'release/') != true
        run: |
          RELEASE_BRANCH="release/${BASE_VERSION}"
          if ! git ls-remote --exit-code --heads origin $RELEASE_BRANCH; then
            git checkout -b $RELEASE_BRANCH
            git push -u origin $RELEASE_BRANCH
          fi

      - name: Resolve Commit SHA
        id: resolved_sha
        run: echo "SHA=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

  # ============================================================
  # Build the compiled native wheel for every supported
  # CPython/PyPy version on every supported OS/arch. Never
  # produces (or falls back to) a pure "-none-any" wheel: the
  # extension is a hard requirement of every artifact built here.
  build-wheels:
    needs: configure-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Native runners avoid cross-architecture tagging/linker assumptions.
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-14, macos-15-intel, windows-2022]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.configure-release.outputs.resolved_sha }}
          fetch-depth: 0

      - name: Stamp Prerelease Version
        if: needs.configure-release.outputs.version_suffix != ''
        shell: bash
        run: |
          cp src/${{ env.PACKAGE_SRCDIR }}/__version__.py src/${{ env.PACKAGE_SRCDIR }}/__version__.py.bak
          echo "__version__ = '${{ needs.configure-release.outputs.version }}'" > src/${{ env.PACKAGE_SRCDIR }}/__version__.py

      - name: Set up Rust for native host builds
        if: runner.os != 'Linux'
        uses: dtolnay/rust-toolchain@stable

      - name: Build native wheels
        uses: pypa/cibuildwheel@v4.2.1

      - name: Restore Original Version
        if: needs.configure-release.outputs.version_suffix != ''
        shell: bash
        run: mv src/${{ env.PACKAGE_SRCDIR }}/__version__.py.bak src/${{ env.PACKAGE_SRCDIR }}/__version__.py

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  # ============================================================
  # Execute the installed native component without DataFrame dependencies.
  # The regular pytest job separately exercises the package-root API with
  # the actual Mountainash dependency graph installed.
  smoke-test-wheels:
    needs: [configure-release, build-wheels]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-14, macos-15-intel, windows-2022]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "pypy3.10", "pypy3.11"]
        # PyPy's published macOS interpreters are x86_64, not arm64.
        exclude:
          - { os: macos-14, python-version: "pypy3.10" }
          - { os: macos-14, python-version: "pypy3.11" }

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.configure-release.outputs.resolved_sha }}

      - name: Set up ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download wheel artifacts
        uses: actions/download-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse

      - name: Native wheel smoke test
        run: python scripts/native_wheel_smoke.py wheelhouse/

  # ============================================================
  # SBOM generation, tag/release creation and asset publication.
  # Unchanged from the previous single-wheel flow except that
  # every native wheel built above is attached to the release and
  # copied into the wheels repository.
  publish-release:
    needs: [configure-release, build-wheels, smoke-test-wheels]
    runs-on: ubuntu-24.04
    env:
      BUILD_ENV: "build_github"
      VERSION: ${{ needs.configure-release.outputs.version }}
      BASE_VERSION: ${{ needs.configure-release.outputs.base_version }}
      TARGET_BRANCH: ${{ needs.configure-release.outputs.target_branch }}
      FALLBACK_BRANCH: ${{ needs.configure-release.outputs.fallback_branch }}

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: mountainash-io

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.configure-release.outputs.resolved_sha }}
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python Dependencies
        run: |
          pip install hatchling==1.29.0
          pip install hatch==1.16.5

      - name: Load Dependencies
        id: deps
        uses: ./.github/actions/load-dependencies
        with:
          config-path: .github/config/mountainash_dependencies.yml

      - name: Checkout Dependencies
        uses: ./.github/actions/checkout-dependencies
        with:
          dependencies: ${{ steps.deps.outputs.dependencies }}
          target-branch: ${{ env.TARGET_BRANCH }}
          default-branch: ${{ env.FALLBACK_BRANCH }}
          token: ${{ steps.app-token.outputs.token }}
          org-name: ${{ env.ORGNAME }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Build Environment
        run: hatch env create ${{ env.BUILD_ENV }}

      - name: Generate SBOMs
        run: |
          hatch run ${{ env.BUILD_ENV }}:sbom-all
          hatch run ${{ env.BUILD_ENV }}:export-requirements
          hatch run ${{ env.BUILD_ENV }}:sbom-direct
          mv ./sbom-full.json ./${{ env.PACKAGE_NAME }}-${{ env.VERSION }}-sbom-full.json
          mv ./sbom-direct.json ./${{ env.PACKAGE_NAME }}-${{ env.VERSION }}-sbom-direct.json

      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: wheelhouse-all
          merge-multiple: true

      - name: List Wheels To Publish
        run: |
          echo "Publishing the following native wheels:"
          ls -la wheelhouse-all/*.whl

      # ======================================================
      # PUBLISH

      - name: Create and Push Tag
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git tag -a "v${{ env.VERSION }}" -m "Release v${{ env.VERSION }}"
          git push origin "v${{ env.VERSION }}"

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ env.VERSION }}
          release_name: ${{ needs.configure-release.outputs.release_title }} v${{ env.VERSION }}
          draft: false
          prerelease: ${{ needs.configure-release.outputs.is_prerelease }}
          body: |
            ${{ needs.configure-release.outputs.release_description }}

            ## Release Details
            - Type: ${{ needs.configure-release.outputs.release_type }}
            - Source Branch: ${{ needs.configure-release.outputs.source_branch }}
            - Target Branch: ${{ needs.configure-release.outputs.target_branch }}
            - Version: ${{ env.VERSION }}

            ## Package Information
            - Package: ${{ env.PACKAGE_NAME }}
            - Base Version: ${{ env.BASE_VERSION }}
            ${{ needs.configure-release.outputs.version_suffix && format('- Version Suffix: {0}', needs.configure-release.outputs.version_suffix) || '' }}

            ## Native Wheels
            This release ships compiled native (`mountainash_rules._native`) wheels for
            CPython 3.10-3.14 on Linux (x86_64/aarch64), macOS (arm64/x86_64)
            and Windows (x86_64). PyPy 3.10/3.11 wheels cover Linux (x86_64/aarch64),
            macOS (x86_64) and Windows (x86_64), matching published interpreter
            distributions. There is no pure-Python / universal wheel.

      - name: Upload Wheels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "v${{ env.VERSION }}" wheelhouse-all/*.whl \
            --repo "${{ github.repository }}" \
            --clobber

      - name: Upload SBOM (Full)
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ env.PACKAGE_NAME }}-${{ env.VERSION }}-sbom-full.json
          asset_name: ${{ env.PACKAGE_NAME }}-${{ env.VERSION }}-sbom-full.json
          asset_content_type: application/xml

      - name: Upload SBOM (Direct)
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ env.PACKAGE_NAME }}-${{ env.VERSION }}-sbom-direct.json
          asset_name: ${{ env.PACKAGE_NAME }}-${{ env.VERSION }}-sbom-direct.json
          asset_content_type: application/xml

      - name: Setup Wheels Repository
        run: |
          # Configure git
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

          # Clone the wheels repository
          git clone https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/${{ env.ORGNAME }}/mountainash-wheels.git wheels-repo

          # Go to the wheels repository
          cd wheels-repo

          # Generate a unique branch name using a timestamp
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          BRANCH_NAME="release/${{ env.PACKAGE_NAME }}-${{ env.VERSION }}-${TIMESTAMP}"

          # Create a new branch for this release
          git checkout -b $BRANCH_NAME

          # Create package directory if it doesn't exist
          mkdir -p ${{ env.PACKAGE_NAME }}

          # Copy every newly built native wheel to the repository
          cp ../wheelhouse-all/*.whl ${{ env.PACKAGE_NAME }}/

          # Add the new wheel files
          git add .

          # Commit the changes
          git commit -m "Add ${{ env.PACKAGE_NAME }} v${{ env.VERSION }} native wheels to wheels repository"

          # Push the branch to the repository
          git push -u origin $BRANCH_NAME

          # Export the branch name for later steps
          echo "WHEELS_BRANCH=${BRANCH_NAME}" >> $GITHUB_ENV

      - name: Create Pull Request
        run: |
          # Create a simpler PR body
          WHEEL_LIST=$(cd wheelhouse-all && ls -1 *.whl | sed 's/^/- /' | paste -sd '\n' -)
          PR_BODY="This PR adds the following native wheels to the wheels repository:\n${WHEEL_LIST}\n\nThis was automatically generated from the release workflow of ${{ github.repository }}."

          # Properly escape the PR body for JSON
          PR_BODY_ESCAPED=$(echo "$PR_BODY" | jq -Rs .)

          # Create the PR
          PR_RESPONSE=$(curl -X POST \
            -H "Authorization: token ${{ steps.app-token.outputs.token }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ env.ORGNAME }}/mountainash-wheels/pulls \
            -d "{
              \"title\": \"Add ${{ env.PACKAGE_NAME }} v${{ env.VERSION }} to wheels repository\",
              \"body\": ${PR_BODY_ESCAPED},
              \"head\": \"${WHEELS_BRANCH}\",
              \"base\": \"main\"
            }")

            echo "API Response: $PR_RESPONSE"

            # Extract PR URL and number
            PR_URL=$(echo "$PR_RESPONSE" | jq -r '.html_url')
            PR_NUMBER=$(echo "$PR_RESPONSE" | jq -r '.number')

            # Add labels to the PR
            if [ "$PR_NUMBER" != "null" ]; then
              curl -X POST \
                -H "Authorization: token ${{ steps.app-token.outputs.token }}" \
                -H "Accept: application/vnd.github.v3+json" \
                https://api.github.com/repos/${{ env.ORGNAME }}/mountainash-wheels/issues/$PR_NUMBER/labels \
                -d '{
                  "labels": ["automated", "wheel"]
                }'

              echo "PR_URL=${PR_URL}" >> $GITHUB_ENV
              echo "::notice::Pull Request created: ${PR_URL}"
            else
              echo "::error::Failed to create Pull Request"
              echo "$PR_RESPONSE"
              exit 1
          fi
