[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mountainash_rules"
dynamic = ["version"]
description = 'Mountain Ash - Utils - Rules'
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_LICENSES"]
keywords = []
authors = [
    { name = "Nathaniel Ramm", email = "nathaniel.ramm@discretedatascience.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
    "polars>=1.35.1",
    "ibis-framework[polars,duckdb]>=11.0.0",
    "narwhals>=1.0.0",
    "pyyaml>=6.0",
    # mountainash is required at runtime but not
    # yet published to PyPI. Test environments install it via path in hatch.toml.
]


[project.urls]
Documentation = "https://github.com/mountainash-io/mountainash-rules#readme"
Issues = "https://github.com/mountainash-io/mountainash-rules/issues"
Source = "https://github.com/mountainash-io/mountainash-rules"

#================
# Tool: cibuildwheel
#================
# Builds the mountainash_rules._native PyO3 extension for every supported
# CPython/PyPy version. There is no pure-Python fallback, so every wheel
# built here is interpreter- and platform-specific (see hatch_build.py).
[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-* cp314-* pp310-* pp311-*"
skip = ["*-musllinux*", "*-win32"]
enable = ["pypy", "pypy-eol"]
archs = ["auto64"]
build-verbosity = 1

[tool.cibuildwheel.linux]
# The manylinux build containers do not ship a Rust toolchain.
before-all = "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal"
environment = { PATH = "$HOME/.cargo/bin:$PATH" }

#================
# Tool: Coverage
#================
[tool.coverage.run]
source_pkgs = ["mountainash_rules"]
branch = true
parallel = true
omit = ["src/mountainash_rules/__version__.py"]

[tool.coverage.paths]
mountainash_rules = [
    "src/mountainash_rules",
    "*/mountainash-rules/src/mountainash_rules",
]
tests = ["tests", "*/mountainash-rules/tests"]

[tool.coverage.report]
exclude_lines = ["no cov", "if __name__ == .__main__:", "if TYPE_CHECKING:"]
