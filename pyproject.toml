[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mountainash_utils_rules"
dynamic = ["version"]
description = 'Mountain Ash - Utils - Rules'
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = []
authors = [
  { name = "Nathaniel Ramm", email = "nathaniel.ramm@discretedatascience.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
  "pandas",
  "polars",
  "ibis-framework[pandas,polars]",
]


[project.urls]
Documentation = "https://github.com/mountainash-io/mountainash-utils-rules#readme"
Issues = "https://github.com/mountainash-io/mountainash-utils-rules/issues"
Source = "https://github.com/mountainash-io/mountainash-utils-rules"
