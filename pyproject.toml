[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mountainash_utils_rules"
dynamic = ["version"]
description = 'Mountain Ash - Utils - Rules'
readme = "README.md"
requires-python = ">=3.10"
# license = "Proprietary"
keywords = []
authors = [
    { name = "Nathaniel Ramm", email = "nathaniel.ramm@discretedatascience.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
    "polars>=1.35.1",
    "ibis-framework[polars,duckdb]>=11.0.0",
    "narwhals>=1.0.0",
    # mountainash (mountainash-expressions) is required at runtime but not
    # yet published to PyPI. Test environments install it via path in hatch.toml.
]


[project.urls]
Documentation = "https://github.com/mountainash-io/mountainash-utils-rules#readme"
Issues = "https://github.com/mountainash-io/mountainash-utils-rules/issues"
Source = "https://github.com/mountainash-io/mountainash-utils-rules"

#================
# Tool: Coverage
#================
[tool.coverage.run]
source_pkgs = ["mountainash_utils_rules", "tests"]
branch = true
parallel = true
omit = ["src/mountainash_utils_rules/__version__.py"]

[tool.coverage.paths]
mountainash_utils_rules = [
    "src/mountainash_utils_rules",
    "*/mountainash-utils-rules/src/mountainash_utils_rules",
]
tests = ["tests", "*/mountainash-utils-rules/tests"]

[tool.coverage.report]
exclude_lines = ["no cov", "if __name__ == .__main__:", "if TYPE_CHECKING:"]
