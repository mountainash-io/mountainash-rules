sonar.projectKey=mountainash-io_mountainash-rules
sonar.organization=mountainash-io

# Source and test roots
sonar.sources=src/
sonar.tests=tests/
sonar.python.version=3.12

# Coverage and test reports (generated by hatch run test:test)
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=junit.xml

# Exclude non-source files from analysis
sonar.exclusions=**/__pycache__/**,**/__version__.py,**/conftest.py

# Exclude test files from source-level rules (security hotspots, duplication)
sonar.test.inclusions=tests/**/*.py
sonar.issue.ignore.multicriteria=s1,s2,s3

# S1: Ignore "credentials" security hotspots in test fixtures
sonar.issue.ignore.multicriteria.s1.ruleKey=python:S2068
sonar.issue.ignore.multicriteria.s1.resourceKey=tests/**/*

# S2: Ignore "insecure protocol" hotspots in test URLs (http://example.com)
sonar.issue.ignore.multicriteria.s2.ruleKey=python:S5332
sonar.issue.ignore.multicriteria.s2.resourceKey=tests/**/*

# S3: Ignore "hardcoded IP" hotspots in test fixtures
sonar.issue.ignore.multicriteria.s3.ruleKey=python:S1313
sonar.issue.ignore.multicriteria.s3.resourceKey=tests/**/*
